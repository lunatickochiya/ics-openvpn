name: Build and Release

# Only build when manually triggered from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build signed OutHome APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          cache: 'gradle'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OUTHOME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret OUTHOME_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/outhome-release.jks"

      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.OUTHOME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OUTHOME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OUTHOME_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          keystoreFile=$RUNNER_TEMP/outhome-release.jks
          keystorePassword=$STORE_PASSWORD
          keystoreAlias=$KEY_ALIAS
          keystoreAliasPassword=$KEY_PASSWORD
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          chmod 600 ~/.gradle/gradle.properties

      - name: Build signed release APK
        run: ./gradlew assembleUiOvpn23Release

      - name: Verify APK signature
        run: |
          APK=$(find main/build/outputs/apk/uiOvpn23/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare release asset
        id: release
        run: |
          TAG=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' main/build.gradle.kts | head -n 1)
          APK=$(find main/build/outputs/apk/uiOvpn23/release -name '*.apk' | head -n 1)
          ASSET="OutHome-${TAG}-v${VERSION}.apk"
          cp "$APK" "$ASSET"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Releasing $ASSET with tag $TAG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.asset }}
          path: ${{ steps.release.outputs.asset }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "OutHome $TAG"
          else
            gh release create "$TAG" "$ASSET" \
              --title "OutHome $TAG" \
              --notes "OutHome build for $TAG (commit ${GITHUB_SHA})."
          fi
