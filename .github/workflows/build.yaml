name: Build and Release

# Only build when manually triggered from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build signed OutHome APKs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          cache: 'gradle'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OUTHOME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret OUTHOME_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/outhome-release.jks"

      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.OUTHOME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OUTHOME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OUTHOME_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          keystoreFile=$RUNNER_TEMP/outhome-release.jks
          keystorePassword=$STORE_PASSWORD
          keystoreAlias=$KEY_ALIAS
          keystoreAliasPassword=$KEY_PASSWORD
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          chmod 600 ~/.gradle/gradle.properties

      - name: Build signed release APKs (arm64-v8a, armeabi-v7a, x86, x86_64)
        run: ./gradlew assembleUiOvpn23Release

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          count=0
          for apk in main/build/outputs/apk/uiOvpn23/release/*.apk; do
            [ -e "$apk" ] || { echo "::error::No release APK was produced"; exit 1; }
            echo "Verifying $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            count=$((count + 1))
          done
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected 4 APKs, found $count"
            exit 1
          fi

      - name: Prepare release assets
        id: release
        run: |
          TAG=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' main/build.gradle.kts | head -n 1)
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "main/build/outputs/apk/uiOvpn23/release/main-ui-ovpn23-${abi}-release.apk" \
               "OutHome-${TAG}-v${VERSION}-${abi}.apk"
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing 4 APKs with tag $TAG"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OutHome-${{ steps.release.outputs.tag }}-apks
          path: OutHome-*-v*-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ASSETS="OutHome-${TAG}-v${VERSION}-*.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --title "OutHome $TAG"
          else
            gh release create "$TAG" $ASSETS \
              --title "OutHome $TAG" \
              --notes "OutHome build for $TAG (commit ${GITHUB_SHA})."
          fi
          # Remove the old universal APK from earlier builds of this tag.
          gh release delete-asset "$TAG" "OutHome-${TAG}-v${VERSION}.apk" --yes 2>/dev/null || true
